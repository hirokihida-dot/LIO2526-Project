# Project metadata, dependencies and pytest configuration.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prevision-ventas"
version = "0.1.0"
description = "Sistema de previsión de ventas (sector automoción) en Dash"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4",
    "dash-iconify>=0.1",
    "pandas>=3.0",
    "plotly>=7.1",
    "statsmodels>=0.15",
    "lightgbm>=4.6",
    "scikit-learn>=1.9",
    "flask-caching>=2.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
